name: Fixture CI

on:
  pull_request:
  workflow_dispatch:

env:
  UV_VERSION: "0.12.6"
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - uses: https://data.forgejo.org/actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: https://data.forgejo.org/astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
      - name: Validate formatting and lint
        run: bash ci/lint.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Validate Compose and build runtime image
        run: bash ci/build.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Run unit tests
        run: bash ci/test.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - uses: https://data.forgejo.org/actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: https://data.forgejo.org/astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
      - name: Audit locked dependencies
        run: bash ci/security.sh
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        if: always()
        with:
          name: incidents-api-security-${{ github.sha }}
          path: .ci-artifacts/security
          if-no-files-found: error
